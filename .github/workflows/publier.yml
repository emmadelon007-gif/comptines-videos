name: Publier sur YouTube
on:
  push:
    branches: [main]
    paths: ['a_publier/*.json']
  workflow_dispatch:
concurrency: publier
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Envoi
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: python3 scripts/publier.py
      - name: Enregistre le résultat
        if: always()
        run: |
          git config user.name "youpi-publication"
          git config user.email "actions@users.noreply.github.com"
          git add publie
          git diff --cached --quiet || (git commit -m "Résultat de publication [skip ci]" && git pull --rebase origin main && git push)
